[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "Customer-support deflection with a confidence-gated escalation ladder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Test helpers are imported for their side effect of being available as fixtures.
"tests/conftest.py" = ["E402"]
